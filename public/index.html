<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>程序员潜能测评</title>
<style>
    :root{
        --bg:#23252b;
        --card:#2d2f36;
        --text:#e6edf3;
        --muted:#94a3b8;
        --primary:#0e90d2;
        --hover:#199ede;
        --danger:#f87272;
    }
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft Yahei",Consolas,sans-serif;}
    body{background:var(--bg);color:var(--text);padding:24px;line-height:1.6;}
    .container{max-width:920px;margin:0 auto;}
    .header{text-align:center;margin-bottom:28px;}
    h1{font-size:26px;color:#fff;margin-bottom:8px;}
    .global-stat{color:var(--muted);margin-bottom:20px;}
    .card{background:var(--card);border-radius:8px;padding:24px;margin-bottom:16px;}
    .info-bar{display:flex;justify-content:space-between;padding:14px 18px;background:#282a31;border-radius:8px;margin-bottom:20px}
    .question{padding:20px;border-bottom:1px solid #383a42;}
    .q-title{font-size:16px;margin-bottom:14px;}
    .opt-item{margin:10px 0;font-size:15px;cursor:pointer;}
    input[type="radio"]{margin-right:8px;transform:scale(1.15);}
    .btn{
        background:var(--primary);
        border:none;color:white;padding:12px 32px;border-radius:6px;font-size:16px;cursor:pointer;transition:0.2s;
    }
    .btn:hover{background:var(--hover)}
    .btn:disabled{background:#475569;cursor:not-allowed}
    .submit-wrap{text-align:center;margin-top:30px}
    .result-card{display:none;margin-top:30px;padding:26px;background:#282a31;border-radius:8px;border-left:4px solid var(--primary)}
    .hide{display:none !important;}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>程序员潜能测试</h1>
        <div class="global-stat">
            <span>参与人数：<span id="all-users">0</span>｜历史平均分：<span id="avg-score">0</span></span>
        </div>
        <p style="color:var(--muted)">题库总量500题，系统随机抽取50题作答；匿名模式，仅统计总分和答题人数，不会保存你的选择</p>
    </div>

    <!--开始页面-->
    <div id="page-start" class="card">
        <p style="margin-bottom:20px;font-size:16px;">测试维度：逻辑推理、代码阅读理解、排错能力、算法意识、自主学习能力，每题2分满分100分</p>
        <div class="submit-wrap">
            <button class="btn" onclick="fetchInitData()">开始测试</button>
        </div>
    </div>

    <!--答题页面-->
    <div id="page-exam" class="hide">
        <div class="info-bar">
            <span>剩余题目：<span id="remain">50</span>/50</span>
        </div>
        <div id="q-list"></div>
        <div class="submit-wrap">
            <button class="btn" id="submitBtn" onclick="submitPaper()">提交答案</button>
        </div>
    </div>

    <!--结果页-->
    <div id="page-result" class="result-card">
        <h2>作答完毕</h2>
        <p>你的得分：<strong id="my-score" style="font-size:22px;color:#0e90d2">0</strong> / 100</p>
        <p id="eval-text"></p>
        <p style="margin-top:12px;color:var(--muted)">更新后数据：总人数 <span id="new-users">0</span>，平均分 <span id="new-avg">0</span></p>
        <div class="submit-wrap" style="margin-top:20px">
            <button class="btn" onclick="resetTest()">重新测试</button>
        </div>
    </div>
</div>

<script>
let questionList = [];

// 获取初始统计和题目
async function fetchInitData() {
    const res = await fetch("/api/submit");
    const data = await res.json();
    document.getElementById("all-users").innerText = data.total_users;
    document.getElementById("avg-score").innerText = data.avg_score;
    questionList = data.questions;
    startExam();
}

function startExam(){
    document.getElementById("page-start").classList.add("hide");
    document.getElementById("page-exam").classList.remove("hide");
    renderQuestions();
}

//渲染题目
function renderQuestions(){
    let html = "";
    questionList.forEach((item,idx)=>{
        html+=`
        <div class="question">
            <div class="q-title">${item.content}</div>
            <div class="opt-item">
                <input type="radio" name="q${idx}" value="0" data-qid="${item.id}" id="opt${idx}0">
                <label for="opt${idx}0">${item.opt_a}</label>
            </div>
            <div class="opt-item">
                <input type="radio" name="q${idx}" value="1" data-qid="${item.id}" id="opt${idx}1">
                <label for="opt${idx}1">${item.opt_b}</label>
            </div>
            <div class="opt-item">
                <input type="radio" name="q${idx}" value="2" data-qid="${item.id}" id="opt${idx}2">
                <label for="opt${idx}2">${item.opt_c}</label>
            </div>
            <div class="opt-item">
                <input type="radio" name="q${idx}" value="3" data-qid="${item.id}" id="opt${idx}3">
                <label for="opt${idx}3">${item.opt_d}</label>
            </div>
        </div>`
    })
    document.getElementById("q-list").innerHTML = html;
}

//提交答案传给后端批改
async function submitPaper(){
    let answers = [];
    for(let i=0;i<50;i++){
        const selectItem = document.querySelector(`input[name="q${i}"]:checked`);
        if(!selectItem){
            alert(`第${i+1}题还未作答`);
            return;
        }
        answers.push({
            qid: Number(selectItem.dataset.qid),
            sel: Number(selectItem.value)
        })
    }
    document.getElementById("submitBtn").disabled = true;
    const resp = await fetch("/api/submit",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({answers})
    })
    const result = await resp.json();
    document.getElementById("page-exam").classList.add("hide");
    document.getElementById("page-result").style.display = "block";
    document.getElementById("my-score").innerText = result.myScore;
    document.getElementById("new-users").innerText = result.total_users;
    document.getElementById("new-avg").innerText = result.avg_score;

    let evalText;
    if(result.myScore >=90){
        evalText="S级潜能：顶尖天赋，适合算法、架构开发";
    }else if(result.myScore >=75){
        evalText="A级潜能：优秀开发者，常规后端前端都能快速上手";
    }else if(result.myScore >=60){
        evalText="B级潜能：合格，系统学习后可以做开发";
    }else if(result.myScore >=40){
        evalText="C级潜能：逻辑偏弱，建议多刷基础习题";
    }else{
        evalText="D级潜能：现阶段不太适合走编程路线";
    }
    document.getElementById("eval-text").innerText = evalText;
}

function resetTest(){
    document.getElementById("page-result").style.display = "none";
    document.getElementById("submitBtn").disabled = false;
    document.getElementById("page-start").classList.remove("hide");
    fetchInitData();
}
</script>
</body>
</html>
